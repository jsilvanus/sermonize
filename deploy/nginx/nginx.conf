# Main nginx configuration for the Sermonize deployment (mounted as /etc/nginx/nginx.conf).
# The site itself is templates/sermonize.conf.template, rendered by the nginx image's entrypoint
# (envsubst, only the variables listed in NGINX_ENVSUBST_FILTER) to /etc/nginx/conf.d/sermonize.conf.
# The image's own conf.d/default.conf is deliberately not included.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Client address, host, request line without query string (OAuth codes and state travel in queries).
    log_format  main  '$remote_addr - [$time_local] "$request_method $scheme://$host$uri $server_protocol" '
                      '$status $body_bytes_sent $request_time "$http_referer" "$http_user_agent" '
                      'upstream=$upstream_addr/$upstream_status/$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65s;
    server_tokens      off;

    # Everything is small except /api/ (batch ingestion), which raises it in its location.
    client_max_body_size  1m;

    # Upstream timeouts (the /mcp and /api/ locations raise the read/send ones).
    proxy_connect_timeout  5s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;

    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    5;
    gzip_min_length    1024;
    gzip_types         text/plain text/css text/javascript application/javascript application/json
                       application/problem+json image/svg+xml application/xml;

    include /etc/nginx/conf.d/sermonize.conf;
}
