# Common reverse-proxy settings; included in every proxied location (proxy_set_header does not
# inherit once a location sets its own, so all of them live here).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# nginx is the edge: replace, don't append, so clients cannot inject addresses into the chain.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
