# Access control for https://DOMAIN/api/admin/ (user and token administration, sermonize-admin).
# Included in that location only. Empty (= no restriction beyond the API's own admin role check)
# by default. To allow only some addresses, uncomment and edit, then:
#   docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload
#
# allow 203.0.113.10;        # office
# allow 198.51.100.0/24;     # VPN
# allow 172.28.0.0/24;       # the compose network (e.g. the tools container via nginx)
# deny  all;
#
# Note: `sermonize-admin login` itself uses /api/auth/login (not restricted here); only the admin
# commands that follow need an allowed address. The tools container can always reach the API
# directly at http://api:3000 without going through nginx.
