# Sermonize on one domain behind the host's nginx (Setup A, docs/deployment.md).
# Installed by deploy/host-nginx/install.sh as /etc/nginx/sites-available/sermonize.conf (symlinked into
# sites-enabled/; conf.d/sermonize.conf on distributions without sites-*), with the domain, certificate
# directory and upstream ports taken from deploy/.env. The snippets live in /etc/nginx/sermonize/.
#
#   /                                               -> web   127.0.0.1:18100 (WEB_HOST_PORT)
#   /mcp, /oauth/, /.well-known/oauth-*,
#   /.well-known/openid-configuration               -> mcp   127.0.0.1:18102 (MCP_HOST_PORT)
#   /api/  (prefix stripped: /api/x -> /x)          -> api   127.0.0.1:18101 (API_HOST_PORT)
#
# Everything else under /.well-known/ is 404; the API's and MCP server's /health are not reachable.
# TLS: Let's Encrypt via the host's certbot (see docs/deployment.md), certificate in
# /etc/letsencrypt/live/sermonize.example.org/. This file is included in nginx's http {} context.

# Client address, host, request line WITHOUT query string (OAuth codes and state travel in queries).
log_format sermonize '$remote_addr - [$time_local] "$request_method $scheme://$host$uri $server_protocol" '
                     '$status $body_bytes_sent $request_time "$http_referer" "$http_user_agent" '
                     'upstream=$upstream_addr/$upstream_status/$upstream_response_time';

upstream sermonize_web {
    server 127.0.0.1:18100;
    keepalive 16;
}

upstream sermonize_api {
    server 127.0.0.1:18101;
    keepalive 16;
}

upstream sermonize_mcp {
    server 127.0.0.1:18102;
    keepalive 16;
}

# ------------------------------------------------------------------------------------------------
# Port 80: ACME http-01 challenges (certbot --webroot -w /var/www/letsencrypt), redirect the rest.

server {
    listen 80;
    listen [::]:80;
    server_name sermonize.example.org;
    server_tokens off;
    access_log /var/log/nginx/sermonize.access.log sermonize;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://sermonize.example.org$request_uri;
    }
}

# ------------------------------------------------------------------------------------------------
# Port 443.

server {
    # `listen ... http2` works on every nginx from 1.10 (Debian/Ubuntu packages); nginx >= 1.25.1 warns
    # that it is deprecated in favour of `http2 on;`, which older versions do not know.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sermonize.example.org;

    ssl_certificate     /etc/letsencrypt/live/sermonize.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sermonize.example.org/privkey.pem;
    include /etc/nginx/sermonize/snippets/tls.conf;

    server_tokens off;
    access_log /var/log/nginx/sermonize.access.log sermonize;
    error_log  /var/log/nginx/sermonize.error.log;

    include /etc/nginx/sermonize/snippets/hsts.conf;

    # Everything is small except /api/ (batch ingestion) and /mcp, which raise it.
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript application/javascript application/json
                    application/problem+json image/svg+xml application/xml;

    # --- MCP server: resource endpoint (Streamable HTTP) ------------------------------------------
    location = /mcp {
        include /etc/nginx/sermonize/snippets/proxy.conf;
        include /etc/nginx/sermonize/snippets/app-headers.conf;
        # Responses may be streamed (text/event-stream): no buffering, no compression, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 4m;
        proxy_pass http://sermonize_mcp;
    }

    # --- MCP server: embedded OAuth authorization server and discovery -----------------------------
    location ^~ /oauth/ {
        include /etc/nginx/sermonize/snippets/proxy.conf;
        include /etc/nginx/sermonize/snippets/hsts.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass http://sermonize_mcp;
    }

    location = /.well-known/oauth-protected-resource {
        include /etc/nginx/sermonize/snippets/proxy.conf;
        include /etc/nginx/sermonize/snippets/app-headers.conf;
        proxy_pass http://sermonize_mcp;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        include /etc/nginx/sermonize/snippets/proxy.conf;
        include /etc/nginx/sermonize/snippets/app-headers.conf;
        proxy_pass http://sermonize_mcp;
    }

    location = /.well-known/oauth-authorization-server {
        include /etc/nginx/sermonize/snippets/proxy.conf;
        include /etc/nginx/sermonize/snippets/app-headers.conf;
        proxy_pass http://sermonize_mcp;
    }

    location = /.well-known/openid-configuration {
        include /etc/nginx/sermonize/snippets/proxy.conf;
        include /etc/nginx/sermonize/snippets/app-headers.conf;
        proxy_pass http://sermonize_mcp;
    }

    # Nothing else under /.well-known/ exists on this site.
    location ^~ /.well-known/ {
        return 404;
    }

    # --- REST API under /api/ (the API's routes are at its root) -----------------------------------
    # The API itself prefixes its root-relative redirects with PUBLIC_BASE_PATH=/api (no proxy_redirect).
    location = /api {
        return 301 https://$host/api/;
    }

    # User and token administration: optional address allowlist (admin-allow.conf, empty by default).
    location ^~ /api/admin/ {
        include /etc/nginx/sermonize/admin-allow.conf;
        include /etc/nginx/sermonize/snippets/proxy.conf;
        include /etc/nginx/sermonize/snippets/app-headers.conf;
        proxy_pass http://sermonize_api/admin/;
    }

    location ^~ /api/ {
        include /etc/nginx/sermonize/snippets/proxy.conf;
        include /etc/nginx/sermonize/snippets/app-headers.conf;
        # Batch ingestion (up to MAX_BATCH_ITEMS chunks/embeddings per request): the API's own
        # body limit is 64 MiB. Large batches may take a while to validate and insert.
        client_max_body_size 64m;
        client_body_buffer_size 1m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://sermonize_api/;
    }

    # --- Web UI: everything else --------------------------------------------------------------------
    location / {
        include /etc/nginx/sermonize/snippets/proxy.conf;
        proxy_pass http://sermonize_web;
    }
}
