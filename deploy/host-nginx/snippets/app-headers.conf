# For responses of the API and the MCP server, which set no security headers of their own.
# (The web UI sets CSP, X-Frame-Options, nosniff and Referrer-Policy itself; nginx only adds HSTS there.
#  The MCP sign-in pages set their own CSP, which nginx leaves alone.)
include /etc/nginx/sermonize/snippets/hsts.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
