# Access control for https://DOMAIN/api/admin/ (user and token administration, sermonize-admin).
# Installed once as /etc/nginx/sermonize/admin-allow.conf (install.sh never overwrites it) and included in
# that location only. Empty (= no restriction beyond the API's own admin role check) by default.
# To allow only some addresses, uncomment and edit, then:  sudo nginx -t && sudo systemctl reload nginx
#
# allow 203.0.113.10;        # office
# allow 198.51.100.0/24;     # VPN
# deny  all;
#
# Note: `sermonize-admin login` itself uses /api/auth/login (not restricted here); only the admin
# commands that follow need an allowed address. The tools container reaches the API directly
# (http://sermonize-api:3000), not through nginx:
#   docker compose run --rm tools sh -c 'sermonize-admin login --email you@example.org && sermonize-admin users list'
