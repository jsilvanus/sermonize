# Publishes the production images to GHCR: ghcr.io/jsilvanus/sermonize-{api,mcp,web,tools}.
# Only for version tags (v1.2.3 -> tags v1.2.3 and latest) and manual runs (workflow_dispatch: tagged with
# the branch name and the short commit, never latest). Deployments use them with
#   SERMONIZE_IMAGE_PREFIX=ghcr.io/jsilvanus/sermonize  SERMONIZE_TAG=v1.2.3   (deploy/.env)
name: Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, mcp, web, tools]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sermonize-${{ matrix.target }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=sermonize-${{ matrix.target }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sermonize-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=sermonize-${{ matrix.target }}
